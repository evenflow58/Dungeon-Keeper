# One-time license setup (do this before the first run):
#
#   1. On your Windows machine, open Unity Hub.
#      Go to Preferences → Licenses → Add → Get a free personal license.
#      Complete the flow so a .ulf file is written to disk at:
#        C:\ProgramData\Unity\Unity_lic.ulf
#      (If that file already exists from a prior activation you can use it.)
#
#   2. Open the .ulf in a text editor (Notepad is fine) and copy the full contents.
#
#   3. In this repo: Settings → Secrets and variables → Actions.
#      Add three repository secrets:
#        UNITY_LICENSE  →  full contents of the .ulf file (paste the XML text)
#        UNITY_EMAIL    →  the email address on your Unity account
#        UNITY_PASSWORD →  the password for your Unity account
#
#   4. Push any commit to a PR targeting main — this workflow will run.
#
# To rotate the license: re-activate in Unity Hub, repeat from step 2.
#
# Unity version: pinned to 6000.6.4f1 to match ProjectSettings/ProjectVersion.txt.
# If GameCI has not yet published a Docker image for this exact patch, update
# unityVersion below to the nearest available 6000.6.x build and note the change.

name: EditMode Tests

permissions:
  contents: read
  checks: write
  pull-requests: read

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: EditMode Tests (Unity ${{ matrix.unityVersion }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        unityVersion:
          - 6000.6.4f1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      # Cache the Library folder so Unity does not reimport every asset on
      # every run. Key on packages-lock.json — any package change invalidates
      # the cache, which is the correct trade-off.
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json') }}
          restore-keys: |
            Library-

      - name: Run EditMode Tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          testMode: EditMode
          unityVersion: ${{ matrix.unityVersion }}
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          artifactsPath: test-results

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EditMode-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
